services:
  ccr:
    build:
      context: .
      dockerfile: Dockerfile
    image: claude-code-router:local
    ports:
      # Publish only Nginx. Internal web/gateway listeners stay inside the container.
      # Bound to all interfaces (LAN-exposed), overriding docker/README.md's
      # local-only guidance -- deliberate, ongoing choice (not a one-off debug
      # session): Steve wants to reach this dashboard from another machine on the
      # LAN (e.g. Windows) and has confirmed he accepts the risk (no TLS/management
      # token in front of this yet -- see docker/README.md's Security guidance).
      - "3458:8080"
    volumes:
      - ccr-data:/data
      # Read-only import of this host's Claude Code CLI OAuth login, so the
      # container's local-login-import scan (which only sees its own /data
      # HOME) can find it. Mounts just the one credentials file, not all of
      # ~/.claude, to keep the container's view of host state minimal.
      - ${HOME}/.claude/.credentials.json:/data/.claude-host/.credentials.json:ro
    environment:
      CLAUDE_CONFIG_DIR: /data/.claude-host
    restart: unless-stopped

volumes:
  ccr-data:
